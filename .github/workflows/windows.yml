name: Build Scanfolio for Windows

on: workflow_dispatch

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.25"
          python-version: "3.12"
          enable-cache: false

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Run offline unit tests
        run: uv run --offline --locked python -m unittest -v

      - name: Build Scanfolio.exe
        run: uv run --offline --locked pyinstaller --onefile --console --name Scanfolio museum_cli.py

      - name: Check executable help
        run: |
          $helpText = .\dist\Scanfolio.exe --help | Out-String
          $helpText = $helpText -replace '\x1b\[[0-9;]*m', ''
          Write-Output $helpText
          if ($LASTEXITCODE -ne 0 -or $helpText -notmatch 'Usage:' -or $helpText -notmatch '--update-key') {
            throw 'Scanfolio.exe --help failed or did not show usage and --update-key.'
          }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Scanfolio-windows-x64
          path: dist/Scanfolio.exe
          if-no-files-found: error
