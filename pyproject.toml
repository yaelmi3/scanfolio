[project]
name = "scanfolio"
version = "0.1.2"
requires-python = ">=3.12"
dependencies = [
    "openai>=2.29,<3",
    "Pillow>=11.3,<13",
    "pydantic>=2.8,<3",
    "rich>=13.9,<16",
    "typer>=0.16,<1",
]

[project.scripts]
scanfolio = "museum_cli:cli"

[dependency-groups]
dev = ["pyinstaller>=6.12,<7"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["museum_cli", "scanfolio_credentials"]
